<!doctype html>
<html lang="zh-CN">
	<head>
	  <meta charset="utf-8">
	  <title>$title</title>
	  <style>
	    :root {
	      --reader-bg: #fff9ef;
	      --reader-chrome: #fff9ef;
	      --reader-sidebar: rgba(255, 252, 246, 0.72);
	      --reader-surface: rgba(255, 252, 246, 0.86);
	      --reader-surface-strong: rgba(255, 250, 243, 0.92);
	      --reader-line: rgba(108, 69, 55, 0.14);
	      --reader-line-strong: rgba(108, 69, 55, 0.24);
	      --reader-text: #2d1712;
	      --reader-heading: #2d1712;
	      --reader-muted: #6c4537;
	      --reader-muted-soft: #8b6a5b;
	      --accent: #e73922;
      --accent-red: #e73922;
      --accent-orange: #ff8a1f;
      --accent-amber: #ffd86a;
      --accent-blue: #2364aa;
      --accent-green: #176e54;
      --accent-soft: rgba(255, 126, 0, 0.12);
	      --accent-soft-text: #7d231b;
	      --signal-extreme: #F92722;
	      --signal-extreme-text: #FFFFFF;
	      --signal-ice: #2364aa;
	      --signal-deep-ice: #12365a;
	      --signal-green: #176e54;
	      --signal-green-soft: rgba(224, 245, 235, 0.8);
	      --reader-cream: #fffaf3;
	      --reader-glass: rgba(255, 255, 255, 0.58);
	      --reader-shadow: rgba(104, 56, 24, 0.12);
	      --editor-width: 1120px;
	      --outline-width: 284px;
	      --outline-rail-width: calc(var(--outline-width) + 36px);
	      --outline-toggle-rail-width: 64px;
	      --outline-toggle-size: 44px;
	      color-scheme: light;
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Avenir Next", -apple-system, BlinkMacSystemFont, sans-serif;
	      letter-spacing: 0;
	    }

    * {
      box-sizing: border-box;
    }

	    body {
	      position: relative;
	      margin: 0;
	      min-height: 100vh;
	      background: var(--reader-bg);
	      color: var(--reader-text);
	      font-size: 15px;
	      line-height: 1.755;
	      -webkit-font-smoothing: antialiased;
	      text-rendering: optimizeLegibility;
	    }

	    a {
	      color: inherit;
	      text-decoration: none;
	    }

		    .bear-shell {
		      position: relative;
		      display: block;
		      min-height: 100vh;
		      width: 100%;
		      margin: 0;
		      overflow: visible;
		      background: transparent;
		      isolation: isolate;
		    }

	    .outline-sidebar {
	      position: fixed;
		      top: 0;
		      left: 0;
		      z-index: 2;
		      width: var(--outline-rail-width);
		      height: 100vh;
		      padding: 18px 0 18px 18px;
		      border-right: 1px solid rgba(255, 255, 255, 0.64);
	      background: var(--reader-sidebar);
	      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
	      box-shadow:
	        16px 0 46px rgba(104, 56, 24, 0.06),
	        inset 1px 0 0 rgba(255, 255, 255, 0.74);
	    }

	    .outline-sticky {
		      position: relative;
		      height: calc(100vh - 36px);
		      overflow-y: auto;
		      margin-right: 18px;
	      border: 1px solid rgba(255, 255, 255, 0.68);
	      border-radius: 24px;
	      padding: 18px 14px 22px;
	      background:
	        linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(255, 252, 246, 0.62)),
	        radial-gradient(circle at 16% 0%, rgba(255, 255, 255, 0.74), transparent 34%);
	      box-shadow:
	        0 18px 44px rgba(104, 56, 24, 0.07),
	        inset 0 1px 0 rgba(255, 255, 255, 0.86);
	      transition:
	        opacity 160ms cubic-bezier(0.16, 1, 0.3, 1),
	        transform 220ms cubic-bezier(0.16, 1, 0.3, 1),
	        visibility 160ms linear;
	    }

	    .outline-toggle {
	      position: absolute;
	      top: 18px;
	      right: 10px;
	      z-index: 1;
	      display: inline-grid;
	      place-items: center;
	      width: var(--outline-toggle-size);
	      height: var(--outline-toggle-size);
	      padding: 0;
	      border: 1px solid rgba(108, 69, 55, 0.18);
	      border-radius: 50%;
	      background: rgba(255, 252, 246, 0.82);
	      color: var(--reader-muted);
	      cursor: pointer;
	      box-shadow:
	        0 7px 16px rgba(104, 56, 24, 0.08),
	        inset 0 1px 0 rgba(255, 255, 255, 0.82);
	      transition:
	        color 160ms cubic-bezier(0.16, 1, 0.3, 1),
	        background 160ms cubic-bezier(0.16, 1, 0.3, 1),
	        transform 160ms cubic-bezier(0.16, 1, 0.3, 1);
	    }

	    .outline-toggle:hover {
	      background: #fffaf3;
	      color: var(--accent-red);
	      transform: translateY(-1px);
	    }

	    .outline-toggle:active {
	      transform: translateY(0) scale(0.96);
	    }

	    .outline-toggle:focus-visible {
	      outline: 2px solid var(--accent-red);
	      outline-offset: 3px;
	    }

	    .outline-toggle-icon {
	      display: block;
	      width: 9px;
	      height: 9px;
	      border-right: 2px solid currentColor;
	      border-bottom: 2px solid currentColor;
	      transform: rotate(135deg) translate(-1px, -1px);
	      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
	    }

	    .bear-shell.is-outline-collapsed .outline-sidebar {
	      transform: translateX(calc(-1 * (var(--outline-rail-width) - var(--outline-toggle-rail-width))));
	    }

	    .bear-shell.is-outline-collapsed .outline-sticky {
	      opacity: 0;
	      pointer-events: none;
	      transform: translateX(-12px);
	      visibility: hidden;
	    }

	    .bear-shell.is-outline-collapsed .editor-pane {
	      margin-left: var(--outline-toggle-rail-width);
	    }

	    .bear-shell.is-outline-collapsed .outline-toggle-icon {
	      transform: rotate(-45deg) translate(-1px, -1px);
	    }

    .window-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

	    .window-controls span {
	      width: 12px;
	      height: 12px;
	      border-radius: 50%;
	      background: var(--accent-amber);
	      box-shadow: 0 7px 16px rgba(104, 56, 24, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.46);
	    }

	    .window-controls span:first-child {
	      background: var(--accent-red);
	    }

	    .window-controls span:last-child {
	      background: var(--accent-orange);
	    }

	    .outline-kicker {
	      margin: 0 0 6px;
	      color: var(--accent-red);
	      font-size: 12px;
	      font-weight: 900;
	      line-height: 1.35;
	      text-transform: uppercase;
	    }

	    .outline-title {
	      margin: 0 0 18px;
	      color: var(--reader-heading);
	      font-size: 15px;
	      font-weight: 900;
	      line-height: 1.45;
	    }

    .outline-nav {
      display: grid;
      gap: 4px;
    }

	    .outline-nav a {
	      position: relative;
	      display: block;
	      min-height: 34px;
	      border: 1px solid transparent;
	      border-radius: 999px;
	      padding: 7px 10px 7px 18px;
	      color: var(--reader-muted);
	      font-size: 13px;
	      font-weight: 800;
	      line-height: 1.35;
	      transition:
	        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
	        color 180ms cubic-bezier(0.16, 1, 0.3, 1),
	        background 180ms cubic-bezier(0.16, 1, 0.3, 1),
	        box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
	    }

    .outline-nav a.level-3 {
      padding-left: 30px;
      font-size: 12px;
      color: var(--reader-muted-soft);
    }

	    .outline-nav a:hover {
	      color: #5f211a;
	      background: rgba(255, 252, 246, 0.76);
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
	      transform: translateY(-1px);
	    }

	    .outline-nav a.is-active {
	      color: var(--reader-cream);
	      border-color: rgba(231, 57, 34, 0.32);
	      background: linear-gradient(145deg, rgba(231, 57, 34, 0.92), rgba(255, 138, 31, 0.82));
	      box-shadow:
	        0 12px 26px rgba(231, 57, 34, 0.16),
	        inset 0 1px 0 rgba(255, 255, 255, 0.32);
	    }

	    .outline-nav a.is-active::before {
	      content: "";
	      position: absolute;
	      top: 50%;
	      left: 8px;
	      width: 3px;
	      height: 1.15em;
	      border-radius: 3px;
	      background: rgba(255, 250, 243, 0.9);
	      transform: translateY(-50%);
	    }

		    .editor-pane {
		      position: relative;
		      z-index: 1;
		      min-width: 0;
		      margin-left: var(--outline-rail-width);
		      background: transparent;
		    }

	    .reader-document {
	      width: 100%;
	      max-width: var(--editor-width);
	      margin: 0 auto;
	      padding: 38px clamp(18px, 3vw, 34px) 88px;
	    }

	    .bear-shell.is-outline-collapsed .reader-document {
	      max-width: calc(var(--editor-width) + var(--outline-rail-width) - var(--outline-toggle-rail-width));
	    }

	    .reader-header {
	      position: relative;
	      margin-bottom: 22px;
	      overflow: hidden;
	      border: 1px solid rgba(255, 255, 255, 0.72);
	      border-radius: 30px;
	      padding: clamp(24px, 4vw, 36px);
	      background:
	        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 252, 246, 0.66)),
	        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.82), transparent 36%),
	        linear-gradient(145deg, rgba(255, 126, 0, 0.09), rgba(255, 255, 255, 0.08));
	      box-shadow:
	        0 24px 62px var(--reader-shadow),
	        0 10px 24px rgba(231, 57, 34, 0.07),
	        inset 0 1px 0 rgba(255, 255, 255, 0.88),
	        inset 0 -24px 64px rgba(255, 126, 0, 0.045);
	      animation: panel-enter 780ms cubic-bezier(0.16, 1, 0.3, 1) both;
	    }

	    .reader-header::before {
	      position: absolute;
	      inset: 0;
	      pointer-events: none;
	      content: "";
	      border-radius: inherit;
	      background:
	        linear-gradient(120deg, rgba(255, 255, 255, 0.5), transparent 32%),
	        radial-gradient(circle at 22% 8%, rgba(255, 255, 255, 0.72), transparent 26%);
	      mask-image: linear-gradient(135deg, black, transparent 58%);
	    }

	    .reader-header h1 {
	      position: relative;
	      margin: 0 0 12px;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: clamp(2.2rem, 5.4vw, 4.9rem);
	      font-weight: 900;
	      line-height: 1.04;
	      letter-spacing: -0.02em;
	      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7), 0 18px 38px rgba(104, 56, 24, 0.12);
	      text-wrap: balance;
	    }

	    .meta {
	      position: relative;
	      display: inline-flex;
	      min-height: 34px;
	      align-items: center;
	      border: 1px solid rgba(231, 57, 34, 0.16);
	      border-radius: 999px;
	      padding-inline: 14px;
	      color: #6b241e;
	      background: rgba(255, 252, 246, 0.74);
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
	      font-size: 14px;
	      font-weight: 800;
	    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: var(--reader-text);
      scroll-margin-top: 32px;
    }

	    .markdown-body {
	      position: relative;
	      overflow: visible;
	      border: 1px solid rgba(255, 255, 255, 0.7);
	      border-radius: 28px;
	      padding: clamp(20px, 4vw, 34px);
	      background:
	        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 252, 246, 0.72)),
	        radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.78), transparent 36%);
	      box-shadow:
	        0 18px 42px rgba(104, 56, 24, 0.075),
	        inset 0 1px 0 rgba(255, 255, 255, 0.86);
	      color: var(--reader-text);
	      font-size: 15px;
	      font-weight: 520;
	      line-height: 1.755;
	      animation: panel-enter 860ms 80ms cubic-bezier(0.16, 1, 0.3, 1) both;
	    }

	    .markdown-body h1 {
	      margin: 0 0 16px;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 2em;
	      font-weight: 900;
	      line-height: 1.52;
	    }

		    .markdown-body h2 {
		      position: relative;
		      margin: 1.24em 0 0.56em;
		      padding-left: 14px;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 1.6em;
	      font-weight: 900;
		      line-height: 1.52;
		    }

		    .markdown-body h2.bear-section-map,
		    .markdown-body h2.bear-section-action,
		    .markdown-body h2.bear-section-evidence {
		      border-radius: 14px;
		      padding: 0.36em 0.7em 0.36em 18px;
		      background: linear-gradient(135deg, rgba(255, 252, 246, 0.78), rgba(255, 255, 255, 0.48));
		    }

		    .markdown-body h2.bear-section-action {
		      border: 1px solid rgba(231, 57, 34, 0.18);
		      box-shadow: 0 10px 24px rgba(231, 57, 34, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.8);
		    }

		    .markdown-body h2.bear-section-evidence {
		      border: 1px solid rgba(108, 69, 55, 0.13);
		      color: color-mix(in srgb, var(--reader-heading) 82%, var(--reader-muted));
		      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
		    }

		    .markdown-body h2.bear-section-map {
		      border: 1px solid rgba(255, 138, 31, 0.16);
		      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
		    }

		    .markdown-body h2::before {
		      position: absolute;
	      top: 0.34em;
	      bottom: 0.34em;
	      left: 0;
	      width: 4px;
	      border-radius: 999px;
	      content: "";
	      background: linear-gradient(180deg, var(--accent-red), var(--accent-orange));
	      box-shadow: 0 8px 18px rgba(231, 57, 34, 0.18);
	    }

	    .markdown-body h3 {
	      margin: 0.94em 0 0.48em;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 1.27em;
	      font-weight: 900;
	      line-height: 1.52;
	    }

    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
	      margin: 0.72em 0 0.48em;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 1.08em;
	      font-weight: 900;
	    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body blockquote,
    .reader-table {
      margin: 14px 0;
    }

    .markdown-body p {
      color: var(--reader-text);
    }

	    .markdown-body strong {
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-weight: 900;
	    }

	    .markdown-body code {
	      padding: 0.25em;
		      border: 1px solid rgba(108, 69, 55, 0.12);
	      border-radius: 0.48em;
	      background: var(--reader-surface);
	      color: var(--reader-text);
	      font-family: "Menlo-Regular", Menlo, Consolas, monospace;
      font-size: 0.91em;
      font-weight: 400;
      font-style: normal;
    }

	    .markdown-body code.stock-ref {
	      display: inline-block;
	      padding: 0.12em 0.42em;
	      border: 1px solid rgba(231, 57, 34, 0.18);
	      background: var(--reader-surface);
	      color: #4a1814;
	      line-height: 1.45;
	      white-space: nowrap;
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
	    }

    .markdown-body ul {
      padding-inline-start: 2.13em;
    }

    .markdown-body li + li {
      margin-top: 4px;
    }

    .markdown-body li::marker {
      color: var(--accent);
    }

	    blockquote {
	      position: relative;
	      border: 1px solid rgba(231, 57, 34, 0.16);
	      border-left: 0;
	      border-radius: 18px;
	      padding: 0.8em 1em 0.8em 2.4em;
	      background:
		        linear-gradient(135deg, rgba(255, 252, 246, 0.82), rgba(255, 255, 255, 0.5)),
	        radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.82), transparent 34%);
	      color: var(--reader-text);
	      box-shadow:
		        0 10px 24px rgba(104, 56, 24, 0.045),
	        inset 0 1px 0 rgba(255, 255, 255, 0.82);
	    }

    blockquote::before {
      content: "";
      position: absolute;
	      top: 0.85em;
	      left: 1em;
	      width: 0.13em;
	      height: calc(100% - 1.7em);
	      border: 1px solid var(--accent-red);
	      border-radius: 0.33em;
	      background: linear-gradient(180deg, var(--accent-red), var(--accent-orange));
	    }

	    .markdown-body pre.fenced-code {
	      display: block;
	      margin: 14px 0;
	      padding: 0.35em 0.7em;
	      overflow-x: auto;
	      border: 1px solid var(--reader-line);
	      border-radius: 16px;
	      background:
		        linear-gradient(180deg, rgba(255, 252, 246, 0.78), rgba(255, 255, 255, 0.5));
	      color: var(--reader-text);
	      font-family: "Menlo-Regular", Menlo, Consolas, monospace;
      font-size: 0.91em;
      line-height: 1.755;
      white-space: pre-wrap;
    }

    .markdown-body pre.fenced-code code {
      display: block;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-size: 1em;
    }

	    .markdown-body pre.fenced-code::before {
	      content: "\200B";
	    }

	    .tomorrow-action-calendar {
	      width: 100%;
	      max-width: 100%;
	      min-width: 0;
	      margin: 0 0 20px;
	      padding: 16px;
	      border: 1px solid color-mix(in srgb, var(--reader-line) 86%, #ffffff);
	      border-radius: 8px;
	      background: rgba(255, 255, 255, 0.72);
	      box-sizing: border-box;
	    }

	    .tomorrow-action-calendar-header {
	      display: flex;
	      align-items: flex-end;
	      justify-content: space-between;
	      gap: 16px;
	      margin: 0 0 12px;
	    }

	    .tomorrow-action-calendar-eyebrow {
	      display: block;
	      margin: 0 0 3px;
	      color: var(--reader-muted-soft);
	      font-size: 11px;
	      font-weight: 700;
	      line-height: 1.2;
	    }

	    .tomorrow-action-calendar-header h2 {
	      margin: 0;
	      color: var(--reader-text);
	      font-size: 18px;
	      line-height: 1.35;
	    }

	    .tomorrow-action-calendar-header p {
	      flex: 0 0 auto;
	      margin: 0;
	      color: var(--reader-muted);
	      font-size: 12px;
	      line-height: 1.45;
	      text-align: right;
	    }

	    .tomorrow-action-calendar-scroll {
	      width: 100%;
	      max-width: 100%;
	      overflow-x: auto;
	      border: 1px solid var(--reader-line);
	      border-radius: 6px;
	      box-sizing: border-box;
	    }

	    .tomorrow-action-calendar-table {
	      width: 100%;
	      min-width: 900px;
	      margin: 0;
	      border: 0;
	      border-collapse: collapse;
	      table-layout: fixed;
	      font-size: 12px;
	      line-height: 1.45;
	    }

	    .tomorrow-action-calendar-table th,
	    .tomorrow-action-calendar-table td {
	      width: 20%;
	      min-width: 180px;
	      border: 0;
	      border-right: 1px solid var(--reader-line);
	      border-bottom: 1px solid var(--reader-line);
	      box-sizing: border-box;
	    }

	    .tomorrow-action-calendar-table tr > :last-child {
	      border-right: 0;
	    }

	    .tomorrow-action-calendar-table tbody tr:last-child td {
	      border-bottom: 0;
	    }

	    .tomorrow-action-calendar-table thead th {
	      height: 36px;
	      padding: 8px 10px;
	      background: rgba(68, 68, 68, 0.055);
	      color: var(--reader-muted);
	      font-size: 12px;
	      font-weight: 700;
	      text-align: center;
	    }

	    .tomorrow-action-calendar-cell {
	      height: 184px;
	      padding: 0;
	      vertical-align: top;
	      background: rgba(255, 255, 255, 0.48);
	    }

	    .tomorrow-action-calendar-cell.is-blank {
	      background: rgba(68, 68, 68, 0.025);
	    }

	    .tomorrow-action-calendar-cell.is-calendar-note {
	      background: rgba(68, 68, 68, 0.035);
	    }

	    .tomorrow-action-calendar-cell.is-holiday {
	      background: rgba(126, 92, 61, 0.07);
	    }

	    .tomorrow-action-calendar-entry {
	      display: flex;
	      min-height: 184px;
	      flex-direction: column;
	      gap: 7px;
	      padding: 11px 12px;
	      box-sizing: border-box;
	    }

	    .tomorrow-action-calendar-date {
	      display: flex;
	      align-items: baseline;
	      justify-content: space-between;
	      gap: 8px;
	      color: var(--reader-muted);
	      font-size: 11px;
	      line-height: 1.3;
	    }

	    .tomorrow-action-calendar-date time,
	    .tomorrow-action-calendar-date-missing {
	      color: var(--reader-text);
	      font-variant-numeric: tabular-nums;
	      font-weight: 700;
	    }

	  <script>
	    (() => {
      const outlineMarker = "$" + "outline_nav";
      const outlineTitleMarker = "$" + "outline_title";
      const hasTemplatePlaceholders = document.body.textContent.includes(outlineMarker);
      if (hasTemplatePlaceholders) {
        const outlineTitle = document.querySelector(".outline-title");
        const headerTitle = document.querySelector(".reader-header h1");
        const meta = document.querySelector(".meta");
        const outlineSlot = Array.from(document.querySelectorAll(".outline-sticky"))
          .find((node) => node.textContent.includes(outlineMarker));
        const body = document.querySelector(".markdown-body");

        if (outlineTitle) {
          outlineTitle.textContent = "2026-06-05 A股日报";
        }
        if (headerTitle) {
          headerTitle.textContent = "2026-06-05 A股日报";
        }
        if (meta) {
          meta.textContent = "2026-06-05 · Bear 样式预览";
        }
        const previewNav = [
          ["preview-overview", "日报裁决总览", "level-2 is-active"],
          ["preview-market", "二、市场基底", "level-2"],
          ["preview-price", "3. 价格带风格", "level-3"],
          ["preview-new-high", "4. 创新高趋势反馈", "level-3"],
          ["preview-action", "六、明日执行计划", "level-2"],
        ].map(([anchor, label, className], index) => (
          `<a class="${className}"${index === 0 ? ' aria-current="true"' : ""} href="#${anchor}" data-outline-anchor="${anchor}">${label}</a>`
        )).join("");
        if (outlineSlot) {
          outlineSlot.innerHTML = outlineSlot.innerHTML
            .replace(outlineTitleMarker, "2026-06-05 A股日报")
            .replace(outlineMarker, `<nav class="outline-nav" aria-label="当前日报标题导航">${previewNav}</nav>`);
        }
        if (body) {
          body.innerHTML = `
            <h2 id="preview-overview">日报裁决总览</h2>
            <p>这是一段 Bear 风格预览正文。重点数据按层级使用 <span class="signal-marker signal-extreme">猩红极致</span>、<span class="signal-marker signal-hot">网易云红</span> 或 <span class="signal-marker signal-cold">荧光绿</span>，而不是把整块表格染色。</p>
            <h2 id="preview-market">二、市场基底</h2>
            <div class="reader-table"><table><thead><tr><th>指标</th><th>数值</th><th>解读</th></tr></thead><tbody>
              <tr><td>Top50成交额占比</td><td class="has-signal"><span class="signal-marker signal-extreme">25.16%</span></td><td>超过25%，极致</td></tr>
              <tr><td>Top50成交额占比</td><td class="has-signal"><span class="signal-marker signal-hot">23.28%</span></td><td>超过20%，资金活跃</td></tr>
              <tr><td>创新高全A占比</td><td class="has-signal"><span class="signal-marker signal-cold">1.96%</span></td><td>低于2%，偏冷</td></tr>
            </tbody></table></div>
            <h3 id="preview-price">3. 价格带风格</h3>
            <p>价格带当日差值超过阈值时，只高亮数字本身：<span class="signal-marker signal-hot">+2.92pct</span>。</p>
            <h3 id="preview-new-high">4. 创新高趋势反馈</h3>
            <p>左侧目录会跟随当前标题高亮，并自动滚动到当前项。</p>
            <h2 id="preview-action">六、明日执行计划</h2>
            <blockquote>明日动作以正文最终计划为准；B1先买参与权，B2只买确认权；B1未变强不补B2，走弱先取消B2并检查B1。</blockquote>
          `;
	        }
	      }

	      const chartPayloadNode = document.getElementById("bear-chart-payload");
	      const chartPayload = (() => {
	        if (!chartPayloadNode) {
	          return {};
	        }
	        try {
	          return JSON.parse(chartPayloadNode.textContent || "{}");
	        } catch (_error) {
	          return {};
	        }
	      })();

	      const shell = document.querySelector(".bear-shell");
	      const outlineToggle = document.querySelector("[data-outline-toggle]");
	      const setOutlineCollapsed = (collapsed) => {
	        if (!shell || !outlineToggle) {
	          return;
	        }
	        shell.classList.toggle("is-outline-collapsed", collapsed);
	        outlineToggle.setAttribute("aria-expanded", String(!collapsed));
	        const label = collapsed ? "展开侧边栏" : "收起侧边栏";
	        outlineToggle.setAttribute("aria-label", label);
	        outlineToggle.setAttribute("title", label);
	        window.dispatchEvent(new Event("resize"));
	      };
      setOutlineCollapsed(false);
      if (outlineToggle) {
        outlineToggle.addEventListener("click", () => {
          setOutlineCollapsed(!shell.classList.contains("is-outline-collapsed"));
        });
      }

	      const escapeText = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
	        "&": "&amp;",
	        "<": "&lt;",
	        ">": "&gt;",
	        '"': "&quot;",
	        "'": "&#39;",
	      })[char]);

	      const cssValue = (name, fallback) => {
	        const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
	        return value || fallback;
	      };

		      const chartTone = {
		        text: cssValue("--reader-text", "#2d1712"),
		        muted: cssValue("--reader-muted", "#6c4537"),
		        line: cssValue("--reader-line", "rgba(108, 69, 55, 0.14)"),
		        red: cssValue("--accent-red", "#e73922"),
		        extremeRed: cssValue("--signal-extreme", "#F92722"),
		        extremeText: cssValue("--signal-extreme-text", "#FFFFFF"),
		        iceBlue: cssValue("--signal-ice", "#2364aa"),
		        deepIceBlue: cssValue("--signal-deep-ice", "#12365a"),

		        const events = Array.isArray(payload?.events) ? payload.events : [];
		        const finiteNumber = (value) => Number.isFinite(Number(value)) ? Number(value) : null;
		        const times = Array.from(new Set(items.map((item) => String(item.time || "")).filter(Boolean))).sort();
		        const groups = new Map();
		        for (const item of items) {
		          const key = String(item.series_key || item.code || item.name || "");
		          if (!key || !item.time) {
		            continue;
		          }
		          if (!groups.has(key)) {
		            const code = item.code && item.code !== item.name ? `(${item.code})` : "";
		            const role = item.role ? ` · ${item.role}` : "";
		            groups.set(key, {
		              key,
		              name: item.name || key,
		              code: item.code || "",
		              role: item.role || "",
		              label: `${item.name || key}${code}${role}`,
		              points: new Map(),
		            });
		          }
		          groups.get(key).points.set(item.time, item);
		        }
		        const groupedItems = Array.from(groups.values());
		        const palette = [chartTone.text, chartTone.red, chartTone.green, "#2F7FB8", "#A88400", "#A75E9B"];
		        const zeroLine = (name) => ({
		          silent: true,
		          symbol: "none",
		          label: {
		            color: chartTone.muted,
		            formatter: name,
		            position: "middle",
		            padding: [2, 6],
		            borderRadius: 999,
		            backgroundColor: "rgba(255,255,255,0.78)",
		          },
		          lineStyle: { color: chartTone.line, type: "dashed" },
		          data: [{ yAxis: 0 }],
		        });
		        const eventMarkPoints = (group) => events
		          .filter((event) => {
		            const eventKey = String(event.series_key || event.code || event.name || "");
		            return event.time && group.points.has(event.time) && (!eventKey || eventKey === group.key || event.name === group.name);
		          })
		          .map((event) => {
		            const point = group.points.get(event.time);
		            const value = finiteNumber(point?.change_pct);
		            if (value === null) {
		              return null;
		            }
		            return {
		              name: event.event || "事件",
		              coord: [event.time, value],
		              value: event.price || event.event || "",
		              itemStyle: { color: chartTone.red },
		              label: {
		                color: chartTone.text,
		                formatter: event.event || "事件",
		              },
		              event,
		            };
		          })
		          .filter(Boolean);
		        const topSeries = groupedItems.map((group, index) => {
		          const marks = eventMarkPoints(group);
		          return {
		            name: group.label,
		            type: "line",
		            smooth: 0.18,
		            symbol: "circle",
		            symbolSize: 5,
		            xAxisIndex: 0,
		            yAxisIndex: 0,
		            lineStyle: { width: 2.2, color: palette[index % palette.length] },
		            itemStyle: { color: palette[index % palette.length] },
		            data: times.map((time) => {
		              const item = group.points.get(time);
		              return { value: finiteNumber(item?.change_pct), item, group };
		            }),
		            ...(index === 0 ? { markLine: zeroLine("0轴") } : {}),
		            ...(marks.length
		              ? {
		                  markPoint: {
		                    symbol: "pin",
		                    symbolSize: 46,
		                    label: { fontSize: 10 },
		                    data: marks,
		                  },
		                }
		              : {}),
		          };
		        });
		        const relativeSeries = groupedItems.map((group, index) => ({
		          name: `${group.label} 相对上证`,
		          type: "line",
		          smooth: 0.18,
		          symbol: "none",
		          xAxisIndex: 1,
		          yAxisIndex: 1,
		          lineStyle: { width: 1.8, type: "dashed", color: palette[index % palette.length], opacity: 0.82 },
		          itemStyle: { color: palette[index % palette.length] },
		          data: times.map((time) => {
		            const item = group.points.get(time);
		            return { value: finiteNumber(item?.relative_pct), item, group };
		          }),
		          ...(index === 0 ? { markLine: zeroLine("相对0轴") } : {}),
		        }));
		        const chart = window.echarts.init(node, null, { renderer: "canvas" });
		        chart.setOption({
		          ...baseChartOption(),
		          color: palette,
		          legend: {
		            top: 8,
		            left: 8,
		            right: 8,
		            type: "scroll",
		            itemWidth: 10,
		            itemHeight: 10,
		            textStyle: { color: chartTone.muted, fontSize: 12 },
		            data: groupedItems.map((group) => group.label),
		          },
		          grid: [
		            { left: 58, right: 28, top: 58, height: "45%", containLabel: false },
		            { left: 58, right: 28, top: "70%", height: "20%", containLabel: false },
		          ],
		          tooltip: {
		            ...baseChartOption().tooltip,
		            trigger: "axis",
		            formatter: (params) => {
		              const list = Array.isArray(params) ? params : [params];
		              const first = list[0] || {};
		              return [
		                `<strong>${escapeText(first.axisValue || "")}</strong>`,
		                ...list.map((param) => {
		                  const item = param.data?.item || {};
		                  const value = param.value === null || param.value === undefined ? "待确认" : formatSignedPct(param.value);
		                  const eventLines = events
		                    .filter((event) => event.time === first.axisValue && (event.series_key === item.series_key || event.name === item.name))
		                    .map((event) => `事件：${escapeText(event.event || "")}${event.note ? ` · ${escapeText(event.note)}` : ""}`);
		                  return [
		                    `${param.marker || ""}${escapeText(param.seriesName)}：${escapeText(value)}`,
		                    ...eventLines,
		                  ].filter(Boolean).join("<br>");
		                }),
		              ].filter(Boolean).join("<br>");
		            },
		          },
		          xAxis: [
		            {
		              type: "category",
		              data: times,
		              axisLabel: { color: chartTone.muted },
		              axisTick: { show: false },
		              axisLine: { lineStyle: { color: chartTone.line } },
		            },
		            {
		              type: "category",
		              gridIndex: 1,
		              data: times,
			              axisLabel: { color: chartTone.muted },
			              axisTick: { show: false },
			              axisLine: { lineStyle: { color: chartTone.line } },
			            },
			          ],
		          yAxis: [
		            {
		              type: "value",
		              name: "涨跌幅",
		              nameTextStyle: { color: chartTone.muted },
		              axisLabel: { color: chartTone.muted, formatter: (value) => `${value}%` },
		              splitLine: { lineStyle: { color: chartTone.line, type: "dashed" } },
		            },
		            {
		              type: "value",
		              gridIndex: 1,
		              name: "相对上证",
		              nameTextStyle: { color: chartTone.muted },
		              axisLabel: { color: chartTone.muted, formatter: (value) => `${value}%` },
		              splitLine: { lineStyle: { color: chartTone.line, type: "dashed" } },
		            },
		          ],
		          dataZoom: [
		            { type: "inside", xAxisIndex: [0, 1], filterMode: "none" },
		          ],
		          series: [...topSeries, ...relativeSeries],
		        });
		        return chart;
		      };

			      const renderedCharts = Array.from(document.querySelectorAll("[data-market-structure-chart]"))
			        .map((node) => renderMarketStructureChart(node))
			        .concat(Array.from(document.querySelectorAll("[data-bear-chart]"))
		        .map((node) => {
		          const key = node.dataset.bearChart;
		          if (key === "t0_market_breadth") {
		            return renderT0MarketBreadthChart(node, chartPayload.t0_market_breadth);
		          }
		          if (key === "intraday_feedback_review") {
			            return renderIntradayFeedbackReviewChart(node, chartPayload.intraday_feedback_review);
		          }
		          if (key === "market_turnover_trend") {
		            return renderMarketTurnoverTrendChart(node, chartPayload.market_turnover_top50_trend);
		          }
		          if (key === "top50_share_trend") {
		            return renderTop50ShareTrendChart(node, chartPayload.market_turnover_top50_trend);
		          }
		          if (key === "new_high_share_trend") {
		            return renderNewHighShareTrendChart(node, chartPayload.new_high_share_trend);
		          }
	          if (key === "sector_turnover_share") {
	            return renderSectorTurnoverShareChart(node, chartPayload.sector_turnover_share);
	          }
	          if (key === "turnover_sector_share") {
	            return renderTurnoverSectorShareChart(node, chartPayload.turnover_sector_share);
	          }
	          if (key === "turnover_top30") {
	            return renderTurnoverTop30Chart(node, chartPayload.turnover_top30);
	          }
	          if (key === "board_tag_rank_bar") {
	            return renderBoardTagRankBarChart(node, chartPayload.board_tag_rank_bar);
	          }
	          if (key === "lhb_net_flow") {
	            return renderLhbNetFlowChart(node, chartPayload.lhb_net_flow);
			          }
			          return null;
		        }))
			        .filter(Boolean);

	      let chartResizeTicking = false;
	      window.addEventListener("resize", () => {
	        if (chartResizeTicking || !renderedCharts.length) {
	          return;
	        }
	        chartResizeTicking = true;
	        window.requestAnimationFrame(() => {
	          for (const chart of renderedCharts) {
	            chart.resize();
	          }
	          chartResizeTicking = false;
	        });
	      });

      const setupTimelineTooltips = () => {
        const targets = Array.from(document.querySelectorAll("[data-el-tooltip]"));
        if (!targets.length) {
          return;
        }
        const tooltip = document.createElement("div");
        tooltip.className = "el-tooltip-popover";
        tooltip.setAttribute("role", "tooltip");
        tooltip.id = "timeline-el-tooltip";
        document.body.appendChild(tooltip);

        let activeTarget = null;

        const hideTooltip = () => {
          activeTarget = null;
          tooltip.classList.remove("is-visible");
          tooltip.removeAttribute("style");
        };

        const positionTooltip = (target) => {
          const rect = target.getBoundingClientRect();
          const tooltipRect = tooltip.getBoundingClientRect();
          const margin = 12;
          const preferredLeft = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
          const left = Math.min(
            Math.max(preferredLeft, margin),
            Math.max(margin, window.innerWidth - tooltipRect.width - margin),
          );
          const aboveTop = rect.top - tooltipRect.height - 10;
          const top = aboveTop > margin ? aboveTop : rect.bottom + 10;
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${Math.min(top, window.innerHeight - tooltipRect.height - margin)}px`;
        };

        const showTooltip = (target) => {
          const text = target.getAttribute("data-el-tooltip") || "";
          if (!text.trim()) {
            return;
          }
          activeTarget = target;
          tooltip.textContent = text;
          tooltip.classList.add("is-visible");
          target.setAttribute("aria-describedby", tooltip.id);
          positionTooltip(target);
        };

        for (const target of targets) {
          target.addEventListener("mouseenter", () => showTooltip(target));
          target.addEventListener("focus", () => showTooltip(target));
          target.addEventListener("mouseleave", hideTooltip);
          target.addEventListener("blur", hideTooltip);
        }

        window.addEventListener("scroll", () => {
          if (activeTarget) {
            positionTooltip(activeTarget);
          }
        }, { passive: true });
        window.addEventListener("resize", () => {
          if (activeTarget) {
            positionTooltip(activeTarget);
          }
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            hideTooltip();
          }
        });
      };
      setupTimelineTooltips();

	      const outline = document.querySelector(".outline-sticky");
	      const nav = document.querySelector(".outline-nav");
	      const links = Array.from(document.querySelectorAll(".outline-nav a[data-outline-anchor]"));
	      const linkByAnchor = new Map(links.map((link) => [link.dataset.outlineAnchor || "", link]));
	      const headings = links
	        .map((link) => document.getElementById(link.dataset.outlineAnchor || ""))
	        .filter(Boolean);
	      if (!outline || !nav || !links.length || !headings.length) {
	        return;
      }

      const hashAnchor = () => {
        if (!window.location.hash) {
          return "";
        }
        try {
          return decodeURIComponent(window.location.hash.slice(1));
        } catch (_error) {
          return window.location.hash.slice(1);
        }
      };

      const scrollActiveIntoOutline = (activeLink) => {
        const outlineRect = outline.getBoundingClientRect();
        const linkRect = activeLink.getBoundingClientRect();
        const topPadding = 72;
        const bottomPadding = 48;
        const above = linkRect.top < outlineRect.top + topPadding;
        const below = linkRect.bottom > outlineRect.bottom - bottomPadding;
        if (!above && !below) {
          return;
        }
        const linkCenter = linkRect.top - outlineRect.top + outline.scrollTop + (linkRect.height / 2);
        const targetTop = Math.max(0, linkCenter - (outline.clientHeight / 2));
	        outline.scrollTo({ top: targetTop });
	      };

	      let activeId = "";
	      const clearActiveLinks = () => {
	        for (const link of links) {
	          link.classList.remove("is-active");
	          link.removeAttribute("aria-current");
	        }
	      };
	      const setActive = (id, options = {}) => {
	        const activeLink = linkByAnchor.get(id);
	        if (!activeLink || id === activeId) {
	          return false;
	        }
	        if (!activeId) {
	          clearActiveLinks();
	        } else {
	          const previousLink = linkByAnchor.get(activeId);
	          if (previousLink) {
	            previousLink.classList.remove("is-active");
	            previousLink.removeAttribute("aria-current");
	          }
	        }
	        activeLink.classList.add("is-active");
	        activeLink.setAttribute("aria-current", "true");
	        activeId = id;
	        if (options.keepVisible) {
	          scrollActiveIntoOutline(activeLink);
	        }
	        return true;
	      };

	      let headingOffsets = [];
	      const refreshHeadingOffsets = () => {
	        headingOffsets = headings.map((heading) => ({
	          id: heading.id,
	          top: heading.getBoundingClientRect().top + window.scrollY,
	        }));
	      };
	      const currentHeadingId = () => {
	        if (!headingOffsets.length) {
	          return headings[0].id;
	        }
	        const scrollTop = window.scrollY + 120;
	        let current = headingOffsets[0];
	        let low = 0;
	        let high = headingOffsets.length - 1;
	        while (low <= high) {
	          const middle = Math.floor((low + high) / 2);
	          const candidate = headingOffsets[middle];
	          if (candidate.top <= scrollTop) {
	            current = candidate;
	            low = middle + 1;
	          } else {
	            high = middle - 1;
	          }
	        }
	        return current.id;
	      };

	      let ticking = false;
	      let forcedActiveId = "";
	      let headingResizeTicking = false;

	      const syncActive = () => {
	        if (forcedActiveId) {
	          setActive(forcedActiveId, { keepVisible: true });
	          return;
	        }
	        if (ticking) {
          return;
	        }
	        ticking = true;
	        window.requestAnimationFrame(() => {
	          setActive(currentHeadingId());
	          ticking = false;
	        });
	      };
	      const scheduleHeadingRefresh = () => {
	        if (headingResizeTicking) {
	          return;
	        }
	        headingResizeTicking = true;
	        window.requestAnimationFrame(() => {
	          refreshHeadingOffsets();
	          syncActive();
	          headingResizeTicking = false;
	        });
	      };

	      for (const link of links) {
	        link.addEventListener("click", (event) => {
          const id = link.dataset.outlineAnchor || "";
          const target = document.getElementById(id);
          if (!target) {
            return;
	          }
	          event.preventDefault();
	          forcedActiveId = id;
	          setActive(id, { keepVisible: true });
	          target.scrollIntoView({ block: "start", inline: "nearest", behavior: "auto" });
	          if (window.history && window.history.replaceState) {
	            window.history.replaceState(null, "", `#${encodeURIComponent(id)}`);
          }
          forcedActiveId = "";
        });
      }
      const releaseForcedActive = () => {
        if (!forcedActiveId) {
          return;
        }
	        forcedActiveId = "";
	        syncActive();
	      };
	      refreshHeadingOffsets();
	      const initialAnchor = hashAnchor();
	      setActive(initialAnchor || currentHeadingId(), { keepVisible: Boolean(initialAnchor) });
	      window.addEventListener("scroll", syncActive, { passive: true });
	      window.addEventListener("resize", scheduleHeadingRefresh);
	      window.addEventListener("hashchange", () => {
	        const anchor = hashAnchor();
	        setActive(anchor || currentHeadingId(), { keepVisible: Boolean(anchor) });
	      });
	      window.addEventListener("load", scheduleHeadingRefresh, { once: true });
	      window.addEventListener("wheel", releaseForcedActive, { passive: true });
      window.addEventListener("mousedown", releaseForcedActive, { passive: true });
      window.addEventListener("keydown", releaseForcedActive);
    })();
  </script>
</body>
</html>
