<!doctype html>
<html lang="zh-CN">
	<head>
	  <meta charset="utf-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1">
	  <title>$title</title>
	  <style>
	    :root {
	      --reader-bg: #fff9ef;
	      --reader-chrome: #fff9ef;
	      --reader-sidebar: rgba(255, 252, 246, 0.72);
	      --reader-surface: rgba(255, 252, 246, 0.86);
	      --reader-surface-strong: rgba(255, 250, 243, 0.92);
	      --reader-line: rgba(108, 69, 55, 0.14);
	      --reader-line-strong: rgba(108, 69, 55, 0.24);
	      --reader-text: #2d1712;
	      --reader-heading: #2d1712;
	      --reader-muted: #6c4537;
	      --reader-muted-soft: #8b6a5b;
	      --accent: #e73922;
	      --accent-red: #e73922;
	      --accent-orange: #ff8a1f;
	      --accent-amber: #ffd86a;
	      --accent-soft: rgba(255, 126, 0, 0.12);
	      --accent-soft-text: #7d231b;
	      --signal-green: #176e54;
	      --signal-green-soft: rgba(224, 245, 235, 0.8);
	      --reader-cream: #fffaf3;
	      --reader-glass: rgba(255, 255, 255, 0.58);
	      --reader-shadow: rgba(104, 56, 24, 0.12);
	      --editor-width: 1120px;
	      --outline-width: 284px;
	      --outline-rail-width: calc(var(--outline-width) + 36px);
	      color-scheme: light;
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Avenir Next", -apple-system, BlinkMacSystemFont, sans-serif;
	      letter-spacing: 0;
	    }

    * {
      box-sizing: border-box;
    }

	    body {
	      position: relative;
	      margin: 0;
	      min-height: 100vh;
	      background: var(--reader-bg);
	      color: var(--reader-text);
	      font-size: 15px;
	      line-height: 1.755;
	      -webkit-font-smoothing: antialiased;
	      text-rendering: optimizeLegibility;
	    }

	    a {
	      color: inherit;
	      text-decoration: none;
	    }

		    .bear-shell {
		      position: relative;
		      display: block;
		      min-height: 100vh;
		      width: 100%;
		      margin: 0;
		      overflow: visible;
		      background: transparent;
		      isolation: isolate;
		    }

		    .outline-sidebar {
		      position: fixed;
		      top: 0;
		      left: 0;
		      z-index: 2;
		      width: var(--outline-rail-width);
		      height: 100vh;
		      padding: 18px 0 18px 18px;
		      border-right: 1px solid rgba(255, 255, 255, 0.64);
		      background: var(--reader-sidebar);
	      box-shadow:
	        16px 0 46px rgba(104, 56, 24, 0.06),
	        inset 1px 0 0 rgba(255, 255, 255, 0.74);
	    }

		    .outline-sticky {
		      position: relative;
		      height: calc(100vh - 36px);
		      overflow-y: auto;
		      margin-right: 18px;
	      border: 1px solid rgba(255, 255, 255, 0.68);
	      border-radius: 24px;
	      padding: 18px 14px 22px;
	      background:
	        linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(255, 252, 246, 0.62)),
	        radial-gradient(circle at 16% 0%, rgba(255, 255, 255, 0.74), transparent 34%);
	      box-shadow:
	        0 18px 44px rgba(104, 56, 24, 0.07),
	        inset 0 1px 0 rgba(255, 255, 255, 0.86);
	    }

    .window-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

	    .window-controls span {
	      width: 12px;
	      height: 12px;
	      border-radius: 50%;
	      background: var(--accent-amber);
	      box-shadow: 0 7px 16px rgba(104, 56, 24, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.46);
	    }

	    .window-controls span:first-child {
	      background: var(--accent-red);
	    }

	    .window-controls span:last-child {
	      background: var(--accent-orange);
	    }

	    .outline-kicker {
	      margin: 0 0 6px;
	      color: var(--accent-red);
	      font-size: 12px;
	      font-weight: 900;
	      line-height: 1.35;
	      text-transform: uppercase;
	    }

	    .outline-title {
	      margin: 0 0 18px;
	      color: var(--reader-heading);
	      font-size: 15px;
	      font-weight: 900;
	      line-height: 1.45;
	    }

    .outline-nav,
    .mobile-nav {
      display: grid;
      gap: 4px;
    }

	    .outline-nav a {
	      position: relative;
	      display: block;
	      min-height: 34px;
	      border: 1px solid transparent;
	      border-radius: 999px;
	      padding: 7px 10px 7px 18px;
	      color: var(--reader-muted);
	      font-size: 13px;
	      font-weight: 800;
	      line-height: 1.35;
	      transition:
	        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
	        color 180ms cubic-bezier(0.16, 1, 0.3, 1),
	        background 180ms cubic-bezier(0.16, 1, 0.3, 1),
	        box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
	    }

    .outline-nav a.level-3 {
      padding-left: 30px;
      font-size: 12px;
      color: var(--reader-muted-soft);
    }

	    .outline-nav a:hover {
	      color: #5f211a;
	      background: rgba(255, 252, 246, 0.76);
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
	      transform: translateY(-1px);
	    }

	    .outline-nav a.is-active {
	      color: var(--reader-cream);
	      border-color: rgba(231, 57, 34, 0.32);
	      background: linear-gradient(145deg, rgba(231, 57, 34, 0.92), rgba(255, 138, 31, 0.82));
	      box-shadow:
	        0 12px 26px rgba(231, 57, 34, 0.16),
	        inset 0 1px 0 rgba(255, 255, 255, 0.32);
	    }

	    .outline-nav a.is-active::before {
	      content: "";
	      position: absolute;
	      top: 50%;
	      left: 8px;
	      width: 3px;
	      height: 1.15em;
	      border-radius: 3px;
	      background: rgba(255, 250, 243, 0.9);
	      transform: translateY(-50%);
	    }

		    .editor-pane {
		      position: relative;
		      z-index: 1;
		      min-width: 0;
		      margin-left: var(--outline-rail-width);
		      background: transparent;
		    }

	    .reader-document {
	      width: 100%;
	      max-width: var(--editor-width);
	      margin: 0 auto;
	      padding: 38px clamp(18px, 3vw, 34px) 88px;
	    }

	    .reader-header {
	      position: relative;
	      margin-bottom: 22px;
	      overflow: hidden;
	      border: 1px solid rgba(255, 255, 255, 0.72);
	      border-radius: 30px;
	      padding: clamp(24px, 4vw, 36px);
	      background:
	        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 252, 246, 0.66)),
	        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.82), transparent 36%),
	        linear-gradient(145deg, rgba(255, 126, 0, 0.09), rgba(255, 255, 255, 0.08));
	      box-shadow:
	        0 24px 62px var(--reader-shadow),
	        0 10px 24px rgba(231, 57, 34, 0.07),
	        inset 0 1px 0 rgba(255, 255, 255, 0.88),
	        inset 0 -24px 64px rgba(255, 126, 0, 0.045);
	      animation: panel-enter 780ms cubic-bezier(0.16, 1, 0.3, 1) both;
	    }

	    .reader-header::before {
	      position: absolute;
	      inset: 0;
	      pointer-events: none;
	      content: "";
	      border-radius: inherit;
	      background:
	        linear-gradient(120deg, rgba(255, 255, 255, 0.5), transparent 32%),
	        radial-gradient(circle at 22% 8%, rgba(255, 255, 255, 0.72), transparent 26%);
	      mask-image: linear-gradient(135deg, black, transparent 58%);
	    }

	    .reader-header h1 {
	      position: relative;
	      margin: 0 0 12px;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: clamp(2.2rem, 5.4vw, 4.9rem);
	      font-weight: 900;
	      line-height: 1.04;
	      letter-spacing: -0.02em;
	      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7), 0 18px 38px rgba(104, 56, 24, 0.12);
	      text-wrap: balance;
	    }

	    .meta {
	      position: relative;
	      display: inline-flex;
	      min-height: 34px;
	      align-items: center;
	      border: 1px solid rgba(231, 57, 34, 0.16);
	      border-radius: 999px;
	      padding-inline: 14px;
	      color: #6b241e;
	      background: rgba(255, 252, 246, 0.74);
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
	      font-size: 14px;
	      font-weight: 800;
	    }

    .mobile-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

	    .mobile-nav a {
	      display: inline-flex;
	      min-height: 34px;
	      align-items: center;
	      border: 1px solid rgba(231, 57, 34, 0.16);
	      border-radius: 999px;
	      padding: 5px 12px;
	      color: var(--reader-muted);
	      background: rgba(255, 252, 246, 0.74);
	      font-size: 14px;
	      font-weight: 800;
	    }

    .mobile-nav a.level-3 {
      display: none;
    }

	    .mobile-nav a:hover {
	      border-color: var(--accent-red);
	      color: var(--accent);
	    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: var(--reader-text);
      scroll-margin-top: 32px;
    }

	    .markdown-body {
	      position: relative;
	      overflow: visible;
	      border: 1px solid rgba(255, 255, 255, 0.7);
	      border-radius: 28px;
	      padding: clamp(20px, 4vw, 34px);
	      background:
	        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 252, 246, 0.72)),
	        radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.78), transparent 36%);
	      box-shadow:
	        0 18px 42px rgba(104, 56, 24, 0.075),
	        inset 0 1px 0 rgba(255, 255, 255, 0.86);
	      color: var(--reader-text);
	      font-size: 15px;
	      font-weight: 520;
	      line-height: 1.755;
	      animation: panel-enter 860ms 80ms cubic-bezier(0.16, 1, 0.3, 1) both;
	    }

	    .markdown-body h1 {
	      margin: 0 0 16px;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 2em;
	      font-weight: 900;
	      line-height: 1.52;
	    }

		    .markdown-body h2 {
		      position: relative;
		      margin: 1.24em 0 0.56em;
		      padding-left: 14px;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 1.6em;
	      font-weight: 900;
		      line-height: 1.52;
		    }

		    .markdown-body h2.bear-section-map,
		    .markdown-body h2.bear-section-action,
		    .markdown-body h2.bear-section-evidence {
		      border-radius: 14px;
		      padding: 0.36em 0.7em 0.36em 18px;
		      background: linear-gradient(135deg, rgba(255, 252, 246, 0.78), rgba(255, 255, 255, 0.48));
		    }

		    .markdown-body h2.bear-section-action {
		      border: 1px solid rgba(231, 57, 34, 0.18);
		      box-shadow: 0 10px 24px rgba(231, 57, 34, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.8);
		    }

		    .markdown-body h2.bear-section-evidence {
		      border: 1px solid rgba(108, 69, 55, 0.13);
		      color: color-mix(in srgb, var(--reader-heading) 82%, var(--reader-muted));
		      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
		    }

		    .markdown-body h2.bear-section-map {
		      border: 1px solid rgba(255, 138, 31, 0.16);
		      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
		    }

		    .markdown-body h2::before {
		      position: absolute;
	      top: 0.34em;
	      bottom: 0.34em;
	      left: 0;
	      width: 4px;
	      border-radius: 999px;
	      content: "";
	      background: linear-gradient(180deg, var(--accent-red), var(--accent-orange));
	      box-shadow: 0 8px 18px rgba(231, 57, 34, 0.18);
	    }

	    .markdown-body h3 {
	      margin: 0.94em 0 0.48em;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 1.27em;
	      font-weight: 900;
	      line-height: 1.52;
	    }

    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
	      margin: 0.72em 0 0.48em;
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 1.08em;
	      font-weight: 900;
	    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body blockquote,
    .reader-table {
      margin: 14px 0;
    }

    .markdown-body p {
      color: var(--reader-text);
    }

	    .markdown-body strong {
	      color: var(--reader-heading);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-weight: 900;
	    }

	    .markdown-body code {
	      padding: 0.25em;
		      border: 1px solid rgba(108, 69, 55, 0.12);
	      border-radius: 0.48em;
	      background: var(--reader-surface);
	      color: var(--reader-text);
	      font-family: "Menlo-Regular", Menlo, Consolas, monospace;
      font-size: 0.91em;
      font-weight: 400;
      font-style: normal;
    }

	    .markdown-body code.stock-ref {
	      display: inline-block;
	      padding: 0.12em 0.42em;
	      border: 1px solid rgba(231, 57, 34, 0.18);
	      background: var(--reader-surface);
	      color: #4a1814;
	      line-height: 1.45;
	      white-space: nowrap;
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
	    }

    .markdown-body ul {
      padding-inline-start: 2.13em;
    }

    .markdown-body li + li {
      margin-top: 4px;
    }

    .markdown-body li::marker {
      color: var(--accent);
    }

	    blockquote {
	      position: relative;
	      border: 1px solid rgba(231, 57, 34, 0.16);
	      border-left: 0;
	      border-radius: 18px;
	      padding: 0.8em 1em 0.8em 2.4em;
	      background:
		        linear-gradient(135deg, rgba(255, 252, 246, 0.82), rgba(255, 255, 255, 0.5)),
	        radial-gradient(circle at 8% 0%, rgba(255, 255, 255, 0.82), transparent 34%);
	      color: var(--reader-text);
	      box-shadow:
		        0 10px 24px rgba(104, 56, 24, 0.045),
	        inset 0 1px 0 rgba(255, 255, 255, 0.82);
	    }

    blockquote::before {
      content: "";
      position: absolute;
	      top: 0.85em;
	      left: 1em;
	      width: 0.13em;
	      height: calc(100% - 1.7em);
	      border: 1px solid var(--accent-red);
	      border-radius: 0.33em;
	      background: linear-gradient(180deg, var(--accent-red), var(--accent-orange));
	    }

	    .markdown-body pre.fenced-code {
	      display: block;
	      margin: 14px 0;
	      padding: 0.35em 0.7em;
	      overflow-x: auto;
	      border: 1px solid var(--reader-line);
	      border-radius: 16px;
	      background:
		        linear-gradient(180deg, rgba(255, 252, 246, 0.78), rgba(255, 255, 255, 0.5));
	      color: var(--reader-text);
	      font-family: "Menlo-Regular", Menlo, Consolas, monospace;
      font-size: 0.91em;
      line-height: 1.755;
      white-space: pre-wrap;
    }

    .markdown-body pre.fenced-code code {
      display: block;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-size: 1em;
    }

    .markdown-body pre.fenced-code::before {
      content: "\200B";
    }

    .position-timeline-shell {
      --timeline-lane-width: 76px;
      --timeline-asset-width: 116px;
      --timeline-grid-line: color-mix(in srgb, var(--reader-line) 72%, #ffffff);
      --timeline-minor-line: rgba(68,68,68,0.022);
      margin: 0 0 18px;
      border: 1px solid color-mix(in srgb, var(--reader-line) 86%, #ffffff);
	      border-radius: 20px;
	      background: rgba(255, 252, 246, 0.76);
	      box-shadow: 0 14px 30px rgba(104, 56, 24, 0.06), inset 0 1px 0 rgba(255,255,255,0.95);
    }

    .position-timeline-scroll {
      overflow-x: auto;
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .position-timeline-table {
      width: 100%;
      min-width: 1040px;
      border: 0;
      border-radius: 0;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 13px;
      line-height: 1.35;
    }

    .position-timeline-table col.timeline-col-lane {
      width: var(--timeline-lane-width);
    }

    .position-timeline-table col.timeline-col-asset {
      width: var(--timeline-asset-width);
    }

    .position-timeline-table col.timeline-col-track {
      width: auto;
    }

    .position-timeline-table th,
    .position-timeline-table td {
      min-width: 0;
      padding: 0;
      border-right: 1px solid var(--timeline-grid-line);
      border-bottom: 1px solid var(--timeline-grid-line);
      overflow-wrap: normal;
      vertical-align: middle;
    }

    .position-timeline-table thead th {
      border-bottom-color: transparent;
    }

    .position-timeline-table tr:last-child th,
    .position-timeline-table tr:last-child td {
      border-bottom: 0;
    }

    .position-timeline-table th:last-child,
    .position-timeline-table td:last-child {
      border-right: 0;
    }

	    .timeline-axis-origin,
	    .timeline-axis-asset,
	    .timeline-axis-track {
	      height: 64px;
	      background:
		        linear-gradient(180deg, rgba(255, 252, 246, 0.84) 0%, rgba(255, 255, 255, 0.6) 100%);
	      color: var(--reader-muted);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
	      font-size: 12px;
	      font-weight: 800;
	      box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--reader-line) 62%, #ffffff);
	    }

    .timeline-axis-origin,
    .timeline-axis-asset {
      position: sticky;
      z-index: 4;
      padding: 0 12px;
      text-align: center;
    }

    .timeline-axis-origin span,
    .timeline-axis-asset span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--reader-muted-soft);
      font-size: 11px;
      font-weight: 600;
    }

    .timeline-axis-origin {
      left: 0;
    }

    .timeline-axis-asset {
      left: var(--timeline-lane-width);
      box-shadow: 8px 0 14px rgba(43, 39, 36, 0.025), inset 0 -1px 0 color-mix(in srgb, var(--reader-line) 62%, #ffffff);
    }

    .timeline-axis-track {
      position: relative;
      padding: 0;
      text-align: center;
	      background:
	        linear-gradient(90deg, var(--timeline-grid-line) 1px, transparent 1px) 0 0 / calc(100% / var(--timeline-days)) 100%,
	        linear-gradient(90deg, var(--timeline-minor-line) 1px, transparent 1px) 0 0 / calc(100% / (var(--timeline-days) * 4)) 100%,
		        linear-gradient(180deg, rgba(255, 252, 246, 0.84) 0%, rgba(255, 255, 255, 0.6) 100%);
	    }

    .timeline-axis-grid {
      display: grid;
      height: 100%;
      grid-template-columns: repeat(var(--timeline-days), minmax(0, 1fr));
    }

    .timeline-axis-date {
      position: relative;
      display: grid;
      min-width: 0;
      align-content: center;
      justify-items: center;
      padding: 6px 12px 8px;
      text-align: center;
    }

    .timeline-axis-date.is-selected {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,255,255,0.4)),
        color-mix(in srgb, var(--accent-red) 8%, #ffffff);
      box-shadow: inset 0 -2px 0 var(--accent-red);
    }

    .timeline-axis-date.is-report-day {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.66), rgba(255,255,255,0.22)),
        color-mix(in srgb, var(--reader-muted) 7%, #ffffff);
    }

    .timeline-axis-date::before {
      content: none;
    }

    .timeline-date-main,
    .timeline-date-weekday {
      display: block;
      white-space: nowrap;
    }

    .timeline-date-main {
      color: var(--reader-heading);
      font-size: 13px;
      font-weight: 700;
    }

    .timeline-date-weekday {
      margin-top: 2px;
      color: var(--reader-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .timeline-date-action,
    .timeline-date-context,
    .timeline-date-intent {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 18px;
      margin-top: 4px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--accent-red);
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 5px 12px rgba(231, 57, 34, 0.16), inset 0 1px 0 rgba(255,255,255,0.24);
    }

    .timeline-date-context {
      min-width: 38px;
      background: color-mix(in srgb, var(--reader-muted) 10%, #ffffff);
      color: var(--reader-muted);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--reader-muted) 20%, #ffffff);
    }

    .timeline-date-intent {
      min-width: 50px;

    .timeline-bar-segment.is-exit .timeline-action-badge {

      box-shadow: 0 4px 10px rgba(231, 57, 34, 0.16), inset 0 1px 0 rgba(255,255,255,0.24);

      background: #ffffff;
      color: color-mix(in srgb, var(--timeline-row-text) 70%, var(--reader-muted));

	    .markdown-body .mermaid {

      width: 100%;
      min-width: 1040px;
      margin: 0;
      padding: 10px 16px 16px;
      overflow-x: auto;
	      background: rgba(255, 252, 246, 0.78);

			    .reader-table {

		        radial-gradient(circle at 10% 0%, rgba(255, 255, 255, 0.82), transparent 34%),

	      content: "";

		    .bear-chart-eyebrow {
	      width: fit-content;
	      padding: 2px 8px;
	      border: 1px solid color-mix(in srgb, var(--accent-red) 28%, var(--reader-line));
	      border-radius: 999px;
		      background: rgba(255, 252, 246, 0.78);

		      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;

		    table {
	      border-collapse: separate;
	      border-spacing: 0;

	      min-width: min(100%, 36rem);

	    .signal-marker {

    .cycle-sector-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45em 1em;

      margin: -0.2em 0 0.85em;

    }

	    .cycle-sector-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35em;

	      padding: 0.22em 0.62em;
	      background: rgba(255, 252, 246, 0.74);
	      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;

    .cycle-sector-legend-dot {
      width: 0.7em;

    }

	    .cycle-sector-label {

	      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;

    }

    .cycle-sector-label {
      display: inline;

    }

	      background: var(--accent-red);

</head>
<body>
  <main class="bear-shell">
    <aside class="outline-sidebar">
      <div class="outline-sticky">
        <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="outline-kicker">当前日报</p>
        <p class="outline-title">$outline_title</p>
        $outline_nav
      </div>
    </aside>

    <article class="editor-pane">
      <div class="reader-document">
        <header class="reader-header">
          <h1>$title</h1>
          <div class="meta">$trade_date · $source</div>
          $mobile_nav
        </header>
        <div class="markdown-body">
          $document_body
        </div>
      </div>
	    </article>
		  </main>
		  $echarts_loader
		  $mermaid_loader
		  <script type="application/json" id="bear-chart-payload">$chart_payload</script>
	  <script>
	    (() => {
      const outlineMarker = "$" + "outline_nav";
      const mobileMarker = "$" + "mobile_nav";
      const outlineTitleMarker = "$" + "outline_title";
      const hasTemplatePlaceholders = document.body.textContent.includes(outlineMarker);
      if (hasTemplatePlaceholders) {
        const outlineTitle = document.querySelector(".outline-title");
        const headerTitle = document.querySelector(".reader-header h1");
        const meta = document.querySelector(".meta");
        const outlineSlot = Array.from(document.querySelectorAll(".outline-sticky"))
          .find((node) => node.textContent.includes(outlineMarker));
        const mobileSlot = Array.from(document.querySelectorAll(".reader-header"))
          .find((node) => node.textContent.includes(mobileMarker));
        const body = document.querySelector(".markdown-body");

        if (outlineTitle) {
          outlineTitle.textContent = "2026-06-05 A股日报";
        }
        if (headerTitle) {
          headerTitle.textContent = "2026-06-05 A股日报";
        }
        if (meta) {
          meta.textContent = "2026-06-05 · Bear 样式预览";
        }
        const previewNav = [
          ["preview-overview", "日报裁决总览", "level-2 is-active"],
          ["preview-market", "二、市场基底", "level-2"],
          ["preview-price", "3. 价格带风格", "level-3"],
          ["preview-new-high", "4. 创新高趋势反馈", "level-3"],
          ["preview-action", "六、明日执行计划", "level-2"],
        ].map(([anchor, label, className], index) => (
          `<a class="${className}"${index === 0 ? ' aria-current="true"' : ""} href="#${anchor}" data-outline-anchor="${anchor}">${label}</a>`
        )).join("");
        if (outlineSlot) {
          outlineSlot.innerHTML = outlineSlot.innerHTML
            .replace(outlineTitleMarker, "2026-06-05 A股日报")
            .replace(outlineMarker, `<nav class="outline-nav" aria-label="当前日报标题导航">${previewNav}</nav>`);
        }
        if (mobileSlot) {
          mobileSlot.innerHTML = mobileSlot.innerHTML.replace(
            mobileMarker,
            `<nav class="mobile-nav" aria-label="当前日报标题导航">${previewNav}</nav>`
          );
        }
        if (body) {
          body.innerHTML = `
            <h2 id="preview-overview">日报裁决总览</h2>

		            symbol: "circle",
		            symbolSize: 5,
		            xAxisIndex: 0,
		            yAxisIndex: 0,
		            lineStyle: { width: 2.2, color: palette[index % palette.length] },
		            itemStyle: { color: palette[index % palette.length] },
		            data: times.map((time) => {
		              const item = group.points.get(time);
		              return { value: finiteNumber(item?.change_pct), item, group };
		            }),
		            ...(index === 0 ? { markLine: zeroLine("0轴") } : {}),
		            ...(marks.length
		              ? {
		                  markPoint: {
		                    symbol: "pin",
		                    symbolSize: 46,
		                    label: { fontSize: 10 },
		                    data: marks,
		                  },
		                }
		              : {}),
		          };
		        });
		        const relativeSeries = groupedItems.map((group, index) => ({
		          name: `${group.label} 相对上证`,
		          type: "line",
		          smooth: 0.18,
		          symbol: "none",
		          xAxisIndex: 1,
		          yAxisIndex: 1,
		          lineStyle: { width: 1.8, type: "dashed", color: palette[index % palette.length], opacity: 0.82 },
		          itemStyle: { color: palette[index % palette.length] },
		          data: times.map((time) => {
		            const item = group.points.get(time);
		            return { value: finiteNumber(item?.relative_pct), item, group };
		          }),
		          ...(index === 0 ? { markLine: zeroLine("相对0轴") } : {}),
		        }));
		        const chart = window.echarts.init(node, null, { renderer: "canvas" });
		        chart.setOption({
		          ...baseChartOption(),
		          color: palette,
		          legend: {
		            top: 8,
		            left: 8,
		            right: 8,
		            type: "scroll",
		            itemWidth: 10,
		            itemHeight: 10,
		            textStyle: { color: chartTone.muted, fontSize: 12 },
		            data: groupedItems.map((group) => group.label),
		          },
		          grid: [
		            { left: 58, right: 28, top: 58, height: "45%", containLabel: false },
		            { left: 58, right: 28, top: "70%", height: "20%", containLabel: false },
		          ],
		          tooltip: {
		            ...baseChartOption().tooltip,
		            trigger: "axis",
		            formatter: (params) => {
		              const list = Array.isArray(params) ? params : [params];
		              const first = list[0] || {};
		              return [
		                `<strong>${escapeText(first.axisValue || "")}</strong>`,
		                ...list.map((param) => {
		                  const item = param.data?.item || {};
		                  const value = param.value === null || param.value === undefined ? "待确认" : formatSignedPct(param.value);
		                  const eventLines = events
		                    .filter((event) => event.time === first.axisValue && (event.series_key === item.series_key || event.name === item.name))
		                    .map((event) => `事件：${escapeText(event.event || "")}${event.note ? ` · ${escapeText(event.note)}` : ""}`);
		                  return [
		                    `${param.marker || ""}${escapeText(param.seriesName)}：${escapeText(value)}`,
		                    ...eventLines,
		                  ].filter(Boolean).join("<br>");
		                }),
		              ].filter(Boolean).join("<br>");
		            },
		          },
		          xAxis: [
		            {
		              type: "category",
		              data: times,
		              axisLabel: { color: chartTone.muted },
		              axisTick: { show: false },
		              axisLine: { lineStyle: { color: chartTone.line } },
		            },
		            {
		              type: "category",
		              gridIndex: 1,
		              data: times,
		              axisLabel: { color: chartTone.muted },
		              axisTick: { show: false },
		              axisLine: { lineStyle: { color: chartTone.line } },
		            },
		          ],
		          yAxis: [
		            {
		              type: "value",
		              name: "涨跌幅",
		              nameTextStyle: { color: chartTone.muted },
		              axisLabel: { color: chartTone.muted, formatter: (value) => `${value}%` },
		              splitLine: { lineStyle: { color: chartTone.line, type: "dashed" } },
		            },
		            {
		              type: "value",
		              gridIndex: 1,
		              name: "相对上证",
		              nameTextStyle: { color: chartTone.muted },
		              axisLabel: { color: chartTone.muted, formatter: (value) => `${value}%` },
		              splitLine: { lineStyle: { color: chartTone.line, type: "dashed" } },
		            },
		          ],
		          dataZoom: [
		            { type: "inside", xAxisIndex: [0, 1], filterMode: "none" },
		          ],
		          series: [...topSeries, ...relativeSeries],
		        });
		        return chart;
		      };

		      const renderedCharts = Array.from(document.querySelectorAll("[data-bear-chart]"))
		        .map((node) => {
		          const key = node.dataset.bearChart;
		          if (key === "intraday_feedback_review") {
		            return renderIntradayFeedbackReviewChart(node, chartPayload.intraday_feedback_review);
		          }
		          if (key === "market_turnover_top50_trend") {
		            return renderMarketTurnoverTop50TrendChart(node, chartPayload.market_turnover_top50_trend);
		          }
	          if (key === "sector_turnover_share") {
	            return renderSectorTurnoverShareChart(node, chartPayload.sector_turnover_share);
	          }
	          if (key === "turnover_sector_share") {
	            return renderTurnoverSectorShareChart(node, chartPayload.turnover_sector_share);
	          }
	          if (key === "turnover_top30") {
	            return renderTurnoverTop30Chart(node, chartPayload.turnover_top30);
	          }
	          if (key === "board_tag_rank_bar") {
	            return renderBoardTagRankBarChart(node, chartPayload.board_tag_rank_bar);
	          }
	          if (key === "lhb_net_flow") {
	            return renderLhbNetFlowChart(node, chartPayload.lhb_net_flow);
	          }
	          return null;
	        })
	        .filter(Boolean);

	      let chartResizeTicking = false;
	      window.addEventListener("resize", () => {
	        if (chartResizeTicking || !renderedCharts.length) {
	          return;
	        }
	        chartResizeTicking = true;
	        window.requestAnimationFrame(() => {
	          for (const chart of renderedCharts) {
	            chart.resize();
	          }
	          chartResizeTicking = false;
	        });
	      });

	      const outline = document.querySelector(".outline-sticky");
	      const nav = document.querySelector(".outline-nav");
	      const links = Array.from(document.querySelectorAll(".outline-nav a[data-outline-anchor]"));
	      const linkByAnchor = new Map(links.map((link) => [link.dataset.outlineAnchor || "", link]));
	      const headings = links
	        .map((link) => document.getElementById(link.dataset.outlineAnchor || ""))
	        .filter(Boolean);
	      if (!outline || !nav || !links.length || !headings.length) {
	        return;
      }

      const hashAnchor = () => {
        if (!window.location.hash) {
          return "";
        }
        try {
          return decodeURIComponent(window.location.hash.slice(1));
        } catch (_error) {
          return window.location.hash.slice(1);
        }
      };

      const scrollActiveIntoOutline = (activeLink) => {
        const outlineRect = outline.getBoundingClientRect();
        const linkRect = activeLink.getBoundingClientRect();
        const topPadding = 72;
        const bottomPadding = 48;
        const above = linkRect.top < outlineRect.top + topPadding;
        const below = linkRect.bottom > outlineRect.bottom - bottomPadding;
        if (!above && !below) {
          return;
        }
        const linkCenter = linkRect.top - outlineRect.top + outline.scrollTop + (linkRect.height / 2);
        const targetTop = Math.max(0, linkCenter - (outline.clientHeight / 2));
	        outline.scrollTo({ top: targetTop });
	      };

	      let activeId = "";
	      const clearActiveLinks = () => {
	        for (const link of links) {
	          link.classList.remove("is-active");
	          link.removeAttribute("aria-current");
	        }
	      };
	      const setActive = (id, options = {}) => {
	        const activeLink = linkByAnchor.get(id);
	        if (!activeLink || id === activeId) {
	          return false;
	        }
	        if (!activeId) {
	          clearActiveLinks();
	        } else {
	          const previousLink = linkByAnchor.get(activeId);
	          if (previousLink) {
	            previousLink.classList.remove("is-active");
	            previousLink.removeAttribute("aria-current");
	          }
	        }
	        activeLink.classList.add("is-active");
	        activeLink.setAttribute("aria-current", "true");
	        activeId = id;
	        if (options.keepVisible) {
	          scrollActiveIntoOutline(activeLink);
	        }
	        return true;
	      };

	      let headingOffsets = [];
	      const refreshHeadingOffsets = () => {
	        headingOffsets = headings.map((heading) => ({
	          id: heading.id,
	          top: heading.getBoundingClientRect().top + window.scrollY,
	        }));
	      };
	      const currentHeadingId = () => {
	        if (!headingOffsets.length) {
	          return headings[0].id;
	        }
	        const scrollTop = window.scrollY + 120;
	        let current = headingOffsets[0];
	        let low = 0;
	        let high = headingOffsets.length - 1;
	        while (low <= high) {
	          const middle = Math.floor((low + high) / 2);
	          const candidate = headingOffsets[middle];
	          if (candidate.top <= scrollTop) {
	            current = candidate;
	            low = middle + 1;
	          } else {
	            high = middle - 1;
	          }
	        }
	        return current.id;
	      };

	      let ticking = false;
	      let forcedActiveId = "";
	      let headingResizeTicking = false;

	      const syncActive = () => {
	        if (forcedActiveId) {
	          setActive(forcedActiveId, { keepVisible: true });
	          return;
	        }
	        if (ticking) {
          return;
	        }
	        ticking = true;
	        window.requestAnimationFrame(() => {
	          setActive(currentHeadingId());
	          ticking = false;
	        });
	      };
	      const scheduleHeadingRefresh = () => {
	        if (headingResizeTicking) {
	          return;
	        }
	        headingResizeTicking = true;
	        window.requestAnimationFrame(() => {
	          refreshHeadingOffsets();
	          syncActive();
	          headingResizeTicking = false;
	        });
	      };

	      for (const link of links) {
	        link.addEventListener("click", (event) => {
          const id = link.dataset.outlineAnchor || "";
          const target = document.getElementById(id);
          if (!target) {
            return;
	          }
	          event.preventDefault();
	          forcedActiveId = id;
	          setActive(id, { keepVisible: true });
	          target.scrollIntoView({ block: "start", inline: "nearest", behavior: "auto" });
	          if (window.history && window.history.replaceState) {
	            window.history.replaceState(null, "", `#${encodeURIComponent(id)}`);
          }
          forcedActiveId = "";
        });
      }
      const releaseForcedActive = () => {
        if (!forcedActiveId) {
          return;
        }
	        forcedActiveId = "";
	        syncActive();
	      };
	      refreshHeadingOffsets();
	      const initialAnchor = hashAnchor();
	      setActive(initialAnchor || currentHeadingId(), { keepVisible: Boolean(initialAnchor) });
	      window.addEventListener("scroll", syncActive, { passive: true });
	      window.addEventListener("resize", scheduleHeadingRefresh);
	      window.addEventListener("hashchange", () => {
	        const anchor = hashAnchor();
	        setActive(anchor || currentHeadingId(), { keepVisible: Boolean(anchor) });
	      });
	      window.addEventListener("load", scheduleHeadingRefresh, { once: true });
	      window.addEventListener("wheel", releaseForcedActive, { passive: true });
      window.addEventListener("mousedown", releaseForcedActive, { passive: true });
      window.addEventListener("touchstart", releaseForcedActive, { passive: true });
      window.addEventListener("keydown", releaseForcedActive);
    })();
  </script>
</body>
</html>
