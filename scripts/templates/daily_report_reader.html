<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    :root {
      --paper: #ffffff;
      --surface: #f7f7f7;
      --line: #e6e6e6;
      --body: #171717;
      --muted: #6f6f6f;
      --accent: #c20c0c;
      --accent-soft: #fff1f1;
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--body);
      font-size: 16px;
      line-height: 1.72;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
      padding-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--body);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    h2 {
      margin: 32px 0 12px;
      color: var(--body);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    nav a {
      border-bottom: 1px solid transparent;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    nav a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    section {
      border-bottom: 1px solid var(--line);
      padding: 6px 0 24px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    td.attention {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 920px);
        padding-top: 24px;
      }

      h1 {
        font-size: 26px;
      }

      th,
      td {
        padding: 9px 8px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>$title</h1>
      <div class="meta">交易日：$trade_date · 来源：$source</div>
      <nav aria-label="日报章节">
        <a href="#tomorrow-action">明日动作</a>
        <a href="#market-spine">市场结构</a>
        <a href="#mainline-evidence">主线证据</a>
        <a href="#candidate-actions">候选动作</a>
        <a href="#data-sources">数据来源</a>
      </nav>
    </header>

    <section id="tomorrow-action">
      <h2>明日动作</h2>
      $tomorrow_action
    </section>

    <section id="market-spine">
      <h2>市场结构</h2>
      $market_spine
    </section>

    <section id="mainline-evidence">
      <h2>主线证据</h2>
      $mainline_evidence
    </section>

    <section id="candidate-actions">
      <h2>候选动作</h2>
      $candidate_actions
    </section>

    <section id="participation-reviews">
      <h2>参与复盘</h2>
      $participation_reviews
    </section>

    <section id="data-sources">
      <h2>数据来源</h2>
      $data_sources
    </section>

    <section id="diagnostics">
      <h2>事实完整性</h2>
      $diagnostics
    </section>
  </main>
</body>
</html>
